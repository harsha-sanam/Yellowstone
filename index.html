<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yellowstone Trip Itinerary — October 9–14, 2026</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yellowstone">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;overflow:hidden;
  background:#0f172a;-webkit-tap-highlight-color:transparent}
.container{display:flex;height:100vh}
.itinerary{width:440px;min-width:440px;display:flex;flex-direction:column;background:#fff;z-index:10}
.header{padding:20px 24px;background:linear-gradient(135deg,#1e293b 0%,#334155 100%);color:#fff}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.header p{font-size:13px;color:#94a3b8;margin-top:4px}
.tabs{display:flex;background:#f8fafc;border-bottom:2px solid #e2e8f0;padding:0 8px}
.tab{flex:1;padding:14px 4px 12px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;
  color:#94a3b8;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;
  text-transform:uppercase;letter-spacing:0.5px}
.tab:hover{color:#475569;background:#f1f5f9}
.tab.active{color:var(--day-color);border-bottom-color:var(--day-color);background:#fff}
.day-subtitle{padding:16px 20px 8px;font-size:13px;color:#64748b;font-weight:500;
  border-bottom:1px solid #f1f5f9;background:#fafbfc}
.day-stats{display:flex;flex-wrap:wrap;gap:16px;padding:8px 20px 12px;background:#fafbfc;border-bottom:1px solid #e2e8f0}
.stat{font-size:11px;color:#94a3b8}
.stat strong{color:#475569}
.stops{flex:1;overflow-y:auto;padding:8px 12px;-webkit-overflow-scrolling:touch}
.trip-note{margin:8px 0;padding:12px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:12px;line-height:1.5}
.trip-note p{margin-top:8px}
.stops::-webkit-scrollbar{width:6px}
.stops::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.stop-card{display:flex;padding:12px;border-radius:10px;margin-bottom:2px;cursor:pointer;
  transition:all .25s ease;border:1.5px solid transparent;position:relative}
.stop-card:hover,.stop-card.highlighted{background:color-mix(in srgb,var(--day-color) 8%,white);
  border-color:color-mix(in srgb,var(--day-color) 40%,white)}
.stop-card.highlighted{box-shadow:0 0 0 1px color-mix(in srgb,var(--day-color) 25%,white)}
.stop-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;margin-right:12px;margin-top:1px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.stop-time{font-size:11px;color:#94a3b8;font-weight:600;min-width:72px;padding-top:2px;margin-right:4px;
  font-variant-numeric:tabular-nums}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:13.5px;font-weight:600;color:#1e293b;line-height:1.3}
.stop-desc{font-size:12px;color:#64748b;margin-top:3px;line-height:1.5}
.stop-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.3px}
.badge-drive{background:#dbeafe;color:#2563eb}
.badge-eat{background:#fef3c7;color:#d97706}
.badge-hike{background:#d1fae5;color:#059669}
.badge-see{background:#ede9fe;color:#7c3aed}
.badge-stay{background:#fce7f3;color:#db2777}
.badge-photo{background:#ffedd5;color:#ea580c}
.badge-shop{background:#f0fdf4;color:#16a34a}
.badge-optional{background:#f1f5f9;color:#94a3b8;border:1px dashed #cbd5e1}
.badge-must{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;
  font-weight:700;box-shadow:0 1px 3px rgba(245,158,11,.45);
  display:inline-flex;align-items:center;gap:3px}
.stop-card.optional{opacity:0.7}
.stop-card.optional .stop-name{color:#64748b}
.stop-card.optional:hover,.stop-card.optional.highlighted{opacity:1}
.stop-card.must{background:linear-gradient(90deg,#fffbeb 0%,transparent 30%)}
.stop-card.must::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
  background:linear-gradient(180deg,#fbbf24,#f59e0b);border-radius:0 2px 2px 0}
.stop-card.must .stop-name{color:#0f172a;font-weight:700}
.stop-card.must:hover,.stop-card.must.highlighted{
  background:linear-gradient(90deg,#fef3c7 0%,color-mix(in srgb,var(--day-color) 6%,white) 100%)}
.click-hint{font-size:10px;color:#94a3b8;margin-top:4px;font-style:italic}
.stop-card:hover .click-hint{color:var(--day-color)}
#map{flex:1;height:100vh}
.costco-gas-marker{background:#dc2626;border:2px solid #fff;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:18px}
.leaflet-control-layers{font-family:inherit;font-size:12px}
.location-control{background:#fff;padding:8px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.35);max-width:210px}
.location-control button{background:#2563eb;color:#fff;border:0;border-radius:4px;padding:8px 10px;font:600 12px inherit;cursor:pointer}
.location-status{font-size:11px;color:#475569;line-height:1.4;margin-top:5px}
.current-location-dot{background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #3b82f633,0 2px 5px #0004}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:10px 14px;font-family:'Segoe UI',sans-serif}
.popup-name{font-weight:700;font-size:13px;color:#1e293b}
.popup-time{font-size:11px;color:#64748b;margin-top:2px}
.popup-desc{font-size:12px;color:#475569;margin-top:4px;line-height:1.4}
.connector{position:absolute;left:24px;top:38px;bottom:-4px;width:2px;background:#e2e8f0}
.stop-card:last-child .connector{display:none}

/* Offline cache UI */
.offline-banner{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:linear-gradient(90deg,#fef3c7,#fde68a);color:#78350f;
  font-size:12px;border-bottom:1px solid #fcd34d;cursor:pointer;
  transition:background .2s}
.offline-banner:hover{background:linear-gradient(90deg,#fde68a,#fcd34d)}
.offline-banner.hidden{display:none}
.offline-banner.success{background:linear-gradient(90deg,#d1fae5,#a7f3d0);color:#065f46;cursor:default}
.offline-banner.progress{background:linear-gradient(90deg,#dbeafe,#bfdbfe);color:#1e40af;cursor:default}
.offline-banner svg{width:16px;height:16px;flex-shrink:0;fill:currentColor}
.offline-banner-text{flex:1;font-weight:600}
.offline-banner-sub{font-weight:400;font-size:11px;opacity:0.85;margin-top:1px}
.offline-progress{
  height:3px;background:rgba(0,0,0,.1);position:relative;overflow:hidden;flex:0 0 100%}
.offline-progress-bar{
  height:100%;background:#1e40af;transition:width .3s}
.offline-status{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;font-size:10px;font-weight:600}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:2000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fadeIn .2s ease}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{transform:translateY(20px) scale(0.96);opacity:0}to{transform:none;opacity:1}}
.modal{
  background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 25px 60px rgba(0,0,0,.4);animation:modalIn .25s ease}
.modal-close{
  position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;
  border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;
  font-size:22px;line-height:1;z-index:10;display:flex;align-items:center;
  justify-content:center;transition:background .2s;font-family:inherit}
.modal-close:hover{background:rgba(0,0,0,.75)}
.modal-image-wrap{
  position:relative;width:100%;aspect-ratio:16/9;background:#f1f5f9;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-image{
  width:100%;height:100%;object-fit:cover;display:none}
.modal-image.loaded{display:block}
.modal-image-status{
  position:absolute;color:#94a3b8;font-size:13px;text-align:center;padding:20px}
.modal-image-status .spinner{
  display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;
  border-top-color:var(--day-color,#3b82f6);border-radius:50%;
  animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-image-credit{
  position:absolute;bottom:6px;right:8px;font-size:10px;color:#fff;
  background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}
.modal-content{padding:18px 22px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-time{
  font-size:11px;color:var(--day-color);font-weight:700;
  text-transform:uppercase;letter-spacing:0.6px}
.modal-title{
  font-size:22px;font-weight:700;color:#1e293b;margin-top:4px;line-height:1.2;letter-spacing:-0.3px}
.modal-badges{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.modal-desc{
  margin-top:14px;font-size:14px;color:#334155;line-height:1.6}
.modal-extract{
  margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9;
  font-size:13px;color:#64748b;line-height:1.6}
.modal-extract-label{
  font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;
  letter-spacing:0.5px;margin-bottom:6px}
.modal-actions{
  margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.modal-action{
  padding:9px 16px;border-radius:8px;background:#f1f5f9;border:none;
  color:#1e293b;font-size:12px;font-weight:600;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  transition:all .2s;font-family:inherit}
.modal-action:hover{background:#e2e8f0}
.modal-action.primary{background:var(--day-color);color:#fff}
.modal-action.primary:hover{filter:brightness(1.1)}

/* Mobile toggle bar */
.mobile-toggle{display:none}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .container{flex-direction:column}
  .itinerary{width:100%;min-width:unset;order:2;flex:1;min-height:0}
  #map{order:1;flex:none;height:38vh;min-height:180px}
  .header{padding:12px 16px}
  .header h1{font-size:17px}
  .header p{font-size:11px;margin-top:2px}
  .tabs{padding:0 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
  .tab{padding:10px 2px 8px;font-size:11px;letter-spacing:0.3px;white-space:nowrap}
  .tab .tab-date{font-size:9px}
  .day-subtitle{padding:10px 14px 4px;font-size:12px}
  .day-stats{padding:4px 14px 8px;gap:10px}
  .stat{font-size:10px}
  .stops{padding:6px 8px}
  .stop-card{padding:10px 8px;border-radius:8px}
  .stop-num{width:22px;height:22px;font-size:10px;margin-right:8px}
  .stop-time{font-size:10px;min-width:54px}
  .stop-name{font-size:12.5px}
  .stop-desc{font-size:11px;margin-top:2px;line-height:1.4}
  .badge{font-size:9px;padding:1px 5px}
  .connector{left:19px;top:34px}
  .leaflet-popup-content{margin:8px 10px}
  .popup-name{font-size:12px}
  .popup-desc{font-size:11px}

  /* Toggle bar */
  .mobile-toggle{
    display:flex;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    z-index:1000;background:#1e293b;border-radius:12px;padding:4px;gap:4px;
    box-shadow:0 4px 20px rgba(0,0,0,.35)}
  .toggle-btn{
    padding:8px 20px;border-radius:9px;border:none;font-size:12px;font-weight:600;
    cursor:pointer;transition:all .2s;color:#94a3b8;background:transparent;
    font-family:inherit;display:flex;align-items:center;gap:5px}
  .toggle-btn.active{background:var(--day-color,#3b82f6);color:#fff}
  .toggle-btn svg{width:14px;height:14px;fill:currentColor}

  /* View modes */
  body.view-map .itinerary{display:none}
  body.view-map #map{height:100vh;flex:1}
  body.view-list #map{display:none}
  body.view-list .itinerary{height:100vh;flex:none}

  /* Mobile modal */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-height:92vh;border-radius:16px 16px 0 0;animation:modalUp .3s ease}
  @keyframes modalUp{from{transform:translateY(100%)}to{transform:none}}
  .modal-title{font-size:18px}
  .modal-content{padding:14px 18px 24px}
  .modal-desc{font-size:13px}
  .modal-extract{font-size:12px}
}

/* Small phones */
@media(max-width:380px){
  .header{padding:10px 12px}
  .header h1{font-size:15px}
  .stop-time{min-width:48px;font-size:9px}
  .stop-num{width:20px;height:20px;font-size:9px;margin-right:6px}
  .stop-name{font-size:12px}
  .stop-desc{font-size:10.5px}
}
</style>
</head>
<body>
<div class="container">
  <div class="itinerary">
    <div class="header">
      <h1>Yellowstone Trip Itinerary</h1>
      <p>October 9 – 14, 2026 &middot; Sunnyvale round trip</p>
    </div>
    <div class="offline-banner hidden" id="offlineBanner">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <div class="offline-banner-text">
        Download for offline use
        <div class="offline-banner-sub">Caches map tiles + photos so you can use this in the parks (no signal)</div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="dayInfo"></div>
    <div class="stops" id="stops"></div>
  </div>
  <div id="map"></div>
</div>

<!-- Mobile toggle bar -->
<div class="mobile-toggle" id="mobileToggle">
  <button class="toggle-btn active" data-view="split" id="btnSplit">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="7" rx="1.5"/><rect x="2" y="14" width="20" height="7" rx="1.5"/></svg>
    Split
  </button>
  <button class="toggle-btn" data-view="map" id="btnMap">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
    Map
  </button>
  <button class="toggle-btn" data-view="list" id="btnList">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    List
  </button>
</div>

<!-- Stop detail modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="modal-image-wrap">
      <img class="modal-image" id="modalImage" alt="">
      <div class="modal-image-status" id="modalImageStatus">
        <div class="spinner"></div>
        <div>Loading photo…</div>
      </div>
      <div class="modal-image-credit" id="modalImageCredit" style="display:none">via Wikipedia</div>
    </div>
    <div class="modal-content">
      <div class="modal-time" id="modalTime"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-badges" id="modalBadges"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <div id="modalExtractWrap" style="display:none">
        <div class="modal-extract">
          <div class="modal-extract-label">About this place</div>
          <div id="modalExtract"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-action primary" id="modalShowMap">📍 Show on Map</button>
        <a class="modal-action" id="modalWikiLink" href="" target="_blank" rel="noopener" style="display:none">Wikipedia →</a>
      </div>
    </div>
  </div>
</div>

// Device location remains separate from the itinerary route and its bounds.
let locationWatchId=null;
let currentLocation=null;
let locationMarker=null;
let locationAccuracy=null;
const locationControl=L.control({position:'bottomright'});
locationControl.onAdd=()=>{
  const container=L.DomUtil.create('div','location-control');
  container.innerHTML='<button type="button">📍 My location</button><div class="location-status" role="status" aria-live="polite">Locating…</div>';
  L.DomEvent.disableClickPropagation(container);
  L.DomEvent.disableScrollPropagation(container);
  container.querySelector('button').addEventListener('click',()=>{
    if(currentLocation) map.setView(currentLocation,Math.max(map.getZoom(),14));
    else startLocationTracking();
  });
  return container;
};
locationControl.addTo(map);
const locationStatus=locationControl.getContainer().querySelector('.location-status');
function startLocationTracking(){
  if(!navigator.geolocation){
    locationStatus.textContent='Location is unavailable in this browser.';
    return;
  }
  if(!window.isSecureContext){
    locationStatus.textContent='Location requires HTTPS or localhost.';
    return;
  }
  if(locationWatchId!==null) navigator.geolocation.clearWatch(locationWatchId);
  locationStatus.textContent='Locating…';
  locationWatchId=navigator.geolocation.watchPosition(position=>{
    const {latitude,longitude,accuracy}=position.coords;
    currentLocation=[latitude,longitude];
    if(!locationMarker){
      locationAccuracy=L.circle(currentLocation,{radius:accuracy,color:'#3b82f6',weight:1,fillColor:'#3b82f6',fillOpacity:0.1,interactive:false}).addTo(map);
      locationMarker=L.marker(currentLocation,{
        icon:L.divIcon({className:'current-location-dot',iconSize:[20,20],iconAnchor:[10,10]}),
        title:'Your current location',alt:'Your current location',zIndexOffset:2000
      }).bindPopup('Your current location').addTo(map);
    } else {
      locationMarker.setLatLng(currentLocation);
      locationAccuracy.setLatLng(currentLocation).setRadius(accuracy);
    }
    locationStatus.textContent='Blue dot: your location (±'+Math.round(accuracy)+' m)';
  },error=>{
    locationStatus.textContent=error.code===1
      ?'Location access denied. Enable it in browser settings, then tap My location.'
      :error.code===3?'Location timed out. Tap My location to retry.'
      :'Location unavailable. Tap My location to retry.';
    if(locationMarker) map.removeLayer(locationMarker);
    if(locationAccuracy) map.removeLayer(locationAccuracy);
    locationMarker=null;
    locationAccuracy=null;
    currentLocation=null;
    if(locationWatchId!==null) navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId=null;
  },{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}
startLocationTracking();
window.addEventListener('pagehide',()=>{
  if(locationWatchId!==null) navigator.geolocation.clearWatch(locationWatchId);
  locationWatchId=null;
});
window.addEventListener('pageshow',event=>{
  if(event.persisted) startLocationTracking();
});

function createMarkerIcon(num,color,highlighted,optional){
  const base=isMobile()?24:26;
  const size=highlighted?(base+10):base;
  const border=highlighted?3:2;
  const bg=optional&&!highlighted?color+'99':color;
  const borderStyle=optional&&!highlighted?`border:${border}px dashed #fff`:`border:${border}px solid #fff`;
  const shadow=highlighted
    ?`box-shadow:0 0 0 6px ${color}44, 0 4px 12px rgba(0,0,0,.4);transform:scale(1.15)`
    :`box-shadow:0 2px 6px rgba(0,0,0,.3)`;
  return L.divIcon({
    className:'',
    iconSize:[size,size],
    iconAnchor:[size/2,size/2],
    popupAnchor:[0,-size/2-4],
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};
      display:flex;align-items:center;justify-content:center;font-size:${highlighted?13:11}px;
      font-weight:700;color:#fff;${borderStyle};${shadow};
      transition:all .3s ease;font-family:'Segoe UI',sans-serif">${num}</div>`
  });
}

  day.stops.forEach((stop,i)=>{
    const marker=L.marker([stop.lat,stop.lng],{
      icon:createMarkerIcon(i+1,day.color,false,stop.optional),
      zIndexOffset:stop.optional?50:100
    }).addTo(map);
    marker.bindPopup(`
      <div class="popup-name">${stop.name}${stop.optional?' <span style="font-size:10px;color:#94a3b8;font-weight:400">(optional)</span>':''}</div>
      <div class="popup-time">${stop.time}</div>
      <div class="popup-desc">${stop.desc}</div>`,
      {closeButton:isMobile(),maxWidth:isMobile()?200:240,autoPan:true});
    markers.push(marker);
    coords.push([stop.lat,stop.lng]);

    marker.on('click',()=>openModal(dayIdx,i));

    if(!isMobile()){
      marker.on('mouseover',()=>{
        if(highlightedIdx!==i) highlightStop(i);
        const card=document.querySelector(`.stop-card[data-idx="${i}"]`);
        if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      marker.on('mouseout',()=>{
        if(highlightedIdx===i) unhighlightStop(i);
      });
    }
  });

  routeLine=L.polyline(coords,{
    color:day.color,weight:3,opacity:0.5,dashArray:'8 6',
    smoothFactor:1.5
  }).addTo(map);

  const bounds=L.latLngBounds(coords);
  map.fitBounds(bounds,{padding:isMobile()?[30,30]:[50,50],maxZoom:11});

  setTimeout(()=>map.invalidateSize(),100);
}

function highlightStop(idx){
  const day=DAYS[activeDay];
  const stop=day.stops[idx];
  highlightedIdx=idx;
  markers[idx].setIcon(createMarkerIcon(idx+1,day.color,true,stop.optional));
  markers[idx].setZIndexOffset(1000);
  markers[idx].openPopup();
  document.querySelectorAll('.stop-card').forEach((c,i)=>c.classList.toggle('highlighted',i===idx));
}

function unhighlightStop(idx){
  const day=DAYS[activeDay];
  const stop=day.stops[idx];
  highlightedIdx=-1;
  markers[idx].setIcon(createMarkerIcon(idx+1,day.color,false,stop.optional));
  markers[idx].setZIndexOffset(stop.optional?50:100);
  markers[idx].closePopup();
  document.querySelectorAll('.stop-card').forEach(c=>c.classList.remove('highlighted'));
}

// Modal
function openModal(dayIdx,stopIdx){
  const day=DAYS[dayIdx];
  const stop=day.stops[stopIdx];
  document.documentElement.style.setProperty('--day-color',day.color);

  document.getElementById('modalTime').textContent=`${day.label} · ${stop.time}`;
  document.getElementById('modalTitle').textContent=stop.name;
  document.getElementById('modalDesc').textContent=stop.desc;

  const badgesEl=document.getElementById('modalBadges');
  badgesEl.innerHTML=stop.badges.map(b=>
    `<span class="badge badge-${b}">${BADGE_LABELS[b]}</span>`).join('');

  const img=document.getElementById('modalImage');
  const status=document.getElementById('modalImageStatus');
  const credit=document.getElementById('modalImageCredit');
  const extractWrap=document.getElementById('modalExtractWrap');
  const extract=document.getElementById('modalExtract');
  const wikiLink=document.getElementById('modalWikiLink');

  img.classList.remove('loaded');
  img.src='';
  status.style.display='block';
  status.innerHTML='<div class="spinner"></div><div>Loading photo…</div>';
  credit.style.display='none';
  extractWrap.style.display='none';
  extract.textContent='';
  wikiLink.style.display='none';

  document.getElementById('modalShowMap').onclick=()=>{
    closeModal();
    map.flyTo([stop.lat,stop.lng],13,{duration:0.6});
    if(currentView==='list') setView('split');
    setTimeout(()=>{
      if(tappedIdx>=0&&tappedIdx!==stopIdx) unhighlightStop(tappedIdx);
      highlightStop(stopIdx);
      tappedIdx=stopIdx;
    },700);
  };

  document.getElementById('modalOverlay').classList.add('open');

  if(stop.wiki){
    fetchWiki(stop.wiki).then(data=>{
      if(!data){
        status.innerHTML='<div>📷 No photo available</div>';
        return;
      }
      const imgUrl=(data.thumbnail&&data.thumbnail.source)||
                   (data.originalimage&&data.originalimage.source);
      if(imgUrl){
        const tempImg=new Image();
        tempImg.onload=()=>{
          img.src=imgUrl;
          img.classList.add('loaded');
          status.style.display='none';
          credit.style.display='block';
        };
        tempImg.onerror=()=>{
          status.innerHTML='<div>📷 Photo unavailable</div>';
        };
        tempImg.src=imgUrl;
      } else {
        status.innerHTML='<div>📷 No photo available</div>';
      }
      if(data.extract){
        extract.textContent=data.extract;
        extractWrap.style.display='block';
      }
      if(data.content_urls&&data.content_urls.desktop){
        wikiLink.href=data.content_urls.desktop.page;
        wikiLink.style.display='inline-flex';
      }
    }).catch(()=>{
      status.innerHTML='<div>📷 Photo unavailable</div>';
    });
  } else {
    status.innerHTML='<div>📷 No photo for this stop</div>';
  }
}

function fetchWiki(slug){
  if(wikiCache[slug]) return Promise.resolve(wikiCache[slug]);
  return fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(slug)}`)
    .then(r=>r.ok?r.json():null)
    .then(data=>{wikiCache[slug]=data;return data;})
    .catch(()=>null);
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalOverlay').addEventListener('click',(e)=>{
  if(e.target.id==='modalOverlay') closeModal();
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeModal();
});

// Mobile view toggle
function setView(view){
  currentView=view;
  document.body.classList.remove('view-map','view-list');
  if(view==='map') document.body.classList.add('view-map');
  else if(view==='list') document.body.classList.add('view-list');

  document.querySelectorAll('.toggle-btn').forEach(b=>{
    const isActive=b.dataset.view===view;
    b.classList.toggle('active',isActive);
    b.style.background=isActive?DAYS[activeDay].color:'transparent';
    b.style.color=isActive?'#fff':'#94a3b8';
  });

  setTimeout(()=>map.invalidateSize(),150);
}

document.getElementById('btnSplit').addEventListener('click',()=>setView('split'));
document.getElementById('btnMap').addEventListener('click',()=>setView('map'));
document.getElementById('btnList').addEventListener('click',()=>setView('list'));

// Build tabs
const tabsEl=document.getElementById('tabs');
DAYS.forEach((day,i)=>{
  const tab=document.createElement('div');
  tab.className='tab';
  tab.innerHTML=`<div style="font-size:13px">${day.label}</div><div class="tab-date" style="font-size:10px;margin-top:2px;color:#94a3b8">${day.date}</div>`;
  tab.addEventListener('click',()=>renderDay(i));
  tabsEl.appendChild(tab);
});

// Handle resize between mobile/desktop
let wasMobile=isMobile();
window.addEventListener('resize',()=>{
  const nowMobile=isMobile();
  if(wasMobile!==nowMobile){
    wasMobile=nowMobile;
    if(!nowMobile){
      document.body.classList.remove('view-map','view-list');
      currentView='split';
    }
    renderDay(activeDay);
    setTimeout(()=>map.invalidateSize(),200);
  } else {
    map.invalidateSize();
  }
});

renderDay(0);

// ============================================================
// PWA + Offline support
// ============================================================
const banner=document.getElementById('offlineBanner');

// Check for fresh deployments while open and when returning to the app.
if('serviceWorker' in navigator){
  let reloadingForUpdate=false;
  navigator.serviceWorker.addEventListener('message',event=>{
    if(event.data?.type==='APP_UPDATED'&&!reloadingForUpdate){
      reloadingForUpdate=true;
      window.location.reload();
    }
  });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    const checkForUpdate=()=>{
      if(!navigator.onLine||document.visibilityState==='hidden') return;
      reg.update().catch(()=>{});
      navigator.serviceWorker.controller?.postMessage({type:'CHECK_APP_UPDATE'});
    };
    checkForUpdate();
    setInterval(checkForUpdate,60000);
    document.addEventListener('visibilitychange',checkForUpdate);
    window.addEventListener('online',checkForUpdate);
    checkOfflineStatus();
  }).catch(err=>console.warn('SW registration failed:',err));
}

// Check whether tiles have been pre-cached
async function checkOfflineStatus(){
  if(!('caches' in window)) return;
  const cache=await caches.open('yellowstone-v2-tiles');
  const keys=await cache.keys();
  if(keys.length<200){
    banner.classList.remove('hidden');
    banner.addEventListener('click',precacheTrip,{once:true});
  } else {
    showCachedStatus(keys.length);
  }
}

function showCachedStatus(tileCount){
  banner.className='offline-banner success';
  banner.innerHTML=`
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    <div class="offline-banner-text">
      Available offline ✓
      <div class="offline-banner-sub">${tileCount} map tiles + photos cached. Safe to use without signal.</div>
    </div>`;
}

// Tile math helpers
function lng2tile(lng,zoom){return Math.floor((lng+180)/360*Math.pow(2,zoom));}
function lat2tile(lat,zoom){
  return Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,zoom));
}

// Trip bounds — Sunnyvale, I-80 / Idaho drive corridor, Yellowstone
const TRIP_BOUNDS = {
  // Wider bounds (round-trip drive corridor) — overview zoom only
  wide: { north: 45.0, south: 37.0, east: -110.0, west: -122.5, minZoom: 7, maxZoom: 9 },
  // Park area — detail zoom
  park: { north: 45.0, south: 43.4, east: -110.0, west: -111.3, minZoom: 10, maxZoom: 12 }
};

function getTilesForBounds(b){
  const tiles=[];
  for(let z=b.minZoom;z<=b.maxZoom;z++){
    const xMin=lng2tile(b.west,z), xMax=lng2tile(b.east,z);
    const yMin=lat2tile(b.north,z), yMax=lat2tile(b.south,z);
    for(let x=xMin;x<=xMax;x++){
      for(let y=yMin;y<=yMax;y++){
        tiles.push(`https://tile.openstreetmap.de/${z}/${x}/${y}.png`);
      }
    }
  }
  return tiles;
}

async function precacheTrip(){
  const allTiles=[
    ...getTilesForBounds(TRIP_BOUNDS.wide),
    ...getTilesForBounds(TRIP_BOUNDS.park)
  ];
  // Dedupe
  const tiles=[...new Set(allTiles)];

  // Wikipedia URLs to pre-fetch
  const wikiUrls=[];
  DAYS.forEach(day=>day.stops.forEach(stop=>{
    if(stop.wiki){
      wikiUrls.push(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(stop.wiki)}`);
    }
  }));

  banner.className='offline-banner progress';
  banner.innerHTML=`
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <div class="offline-banner-text" id="cacheText">
      Downloading… 0 / ${tiles.length+wikiUrls.length}
      <div class="offline-banner-sub">Keep this tab open. May take 1-3 minutes on wifi.</div>
    </div>`;

  let done=0;
  const total=tiles.length+wikiUrls.length;

  async function downloadBatch(urls,label){
    // Process in batches of 10 to avoid overwhelming the network
    for(let i=0;i<urls.length;i+=10){
      const batch=urls.slice(i,i+10);
      await Promise.allSettled(batch.map(async url=>{
        try{
          const r=await fetch(url,{cache:'no-cache'});
          if(r.ok){
            // Trigger SW to cache it
            await r.blob();
          }
        }catch(e){}
        done++;
        const t=document.getElementById('cacheText');
        if(t) t.firstChild.textContent=`Downloading ${label}… ${done} / ${total}`;
      }));
    }
  }

  // Tiles first (most important)
  await downloadBatch(tiles,'map tiles');
  // Then wiki data
  await downloadBatch(wikiUrls,'photos & info');

  // Pre-fetch the actual Wikipedia images too (from the wiki API responses)
  banner.querySelector('.offline-banner-sub').textContent='Caching photos…';
  const imgUrls=[];
  for(const url of wikiUrls){
    try{
      const cache=await caches.open('yellowstone-v2-wiki');
      const resp=await cache.match(url);
      if(resp){
        const data=await resp.json();
        const img=(data.thumbnail&&data.thumbnail.source)||(data.originalimage&&data.originalimage.source);
        if(img) imgUrls.push(img);
      }
    }catch(e){}
  }

  if(imgUrls.length){
    await Promise.allSettled(imgUrls.map(url=>fetch(url).catch(()=>{})));
  }

  showCachedStatus(tiles.length);
}
